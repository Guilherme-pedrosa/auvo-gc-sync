name: Agenda regression checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  agenda-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm run test:agenda
      - run: npm test -- --run src/test/reports-sync.test.ts src/test/reports-sync-page.test.tsx
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npx --yes deno@2.9.6 check --no-lock supabase/functions/central-sync/index.ts
